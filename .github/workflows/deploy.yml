name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: amazon-ppc-bid-optimizer
  REGION: us-central1
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io
      
      - name: Build Backend
        run: |
          docker build -t gcr.io/$PROJECT_ID/amazon-ppc-backend:$GITHUB_SHA \
            -t gcr.io/$PROJECT_ID/amazon-ppc-backend:latest \
            -f backend/Dockerfile ./backend
          docker push gcr.io/$PROJECT_ID/amazon-ppc-backend:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/amazon-ppc-backend:latest
      
      - name: Build Frontend
        run: |
          docker build -t gcr.io/$PROJECT_ID/amazon-ppc-frontend:$GITHUB_SHA \
            -t gcr.io/$PROJECT_ID/amazon-ppc-frontend:latest \
            -f frontend/Dockerfile ./frontend
          docker push gcr.io/$PROJECT_ID/amazon-ppc-frontend:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/amazon-ppc-frontend:latest
      
      - name: Deploy Backend Jobs
        run: |
          gcloud run jobs deploy ads-data-sync \
            --image=gcr.io/$PROJECT_ID/amazon-ppc-backend:$GITHUB_SHA \
            --region=$REGION \
            --set-env-vars=JOB_TYPE=ads_sync \
            --memory=2Gi \
            --cpu=2 \
            --max-retries=2 \
            --task-timeout=30m
          
          gcloud run jobs deploy orders-sync \
            --image=gcr.io/$PROJECT_ID/amazon-ppc-backend:$GITHUB_SHA \
            --region=$REGION \
            --set-env-vars=JOB_TYPE=orders_sync \
            --memory=2Gi \
            --cpu=2 \
            --max-retries=2 \
            --task-timeout=30m
          
          gcloud run jobs deploy bid-optimizer \
            --image=gcr.io/$PROJECT_ID/amazon-ppc-backend:$GITHUB_SHA \
            --region=$REGION \
            --set-env-vars=JOB_TYPE=bid_optimizer \
            --memory=2Gi \
            --cpu=2 \
            --max-retries=1 \
            --task-timeout=1h
      
      - name: Deploy Frontend
        run: |
          gcloud run deploy amazon-ppc-dashboard \
            --image=gcr.io/$PROJECT_ID/amazon-ppc-frontend:$GITHUB_SHA \
            --region=$REGION \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10
