name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: amazon-ppc-bid-optimizer
  REGION: us-central1
  BIGQUERY_DATASET: amazon_ppc
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Google Cloud authentication configuration
        shell: bash
        run: |
          set -euo pipefail

          has_wif=false
          has_json=false

          if [[ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}" || -n "${GCP_SERVICE_ACCOUNT}" ]]; then
            if [[ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" || -z "${GCP_SERVICE_ACCOUNT}" ]]; then
              echo "::error::Workload Identity authentication requires both GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT secrets."
              exit 1
            fi
            has_wif=true
          fi

          if [[ -n "${GCP_CREDENTIALS_JSON}" ]]; then
            has_json=true
          fi

          if [[ "${has_wif}" == "true" && "${has_json}" == "true" ]]; then
            echo "::error::Configure exactly one Google Cloud authentication method: Workload Identity Federation or GCP_CREDENTIALS_JSON, not both."
            exit 1
          fi

          if [[ "${has_wif}" == "false" && "${has_json}" == "false" ]]; then
            echo "::error::No Google Cloud credentials are configured. Add both GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT, or add GCP_CREDENTIALS_JSON."
            exit 1
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.GCP_CREDENTIALS_JSON == '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with service-account JSON
        if: ${{ env.GCP_CREDENTIALS_JSON != '' && env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && env.GCP_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Create Artifact Registry repository
        run: |
          gcloud artifacts repositories create amazon-ppc \
            --repository-format=docker \
            --location=$REGION \
            --project=$PROJECT_ID \
            --quiet || true

      # Retries transient registry failures (e.g. Docker Hub 502s pulling the
      # base image) instead of failing the whole deploy outright. Confirmed
      # 2026-07-15: a bare `docker build` failed the entire workflow on a
      # 502 Bad Gateway from registry-1.docker.io with no retry, which - had
      # it happened on a fix commit instead of a lucky no-op push - would
      # have left the running Cloud Run Jobs silently on stale code with no
      # failure signal short of manually checking Actions.
      - name: Build Backend
        run: |
          retry() {
            local n=1 max=3 delay=15
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::Command failed after $n attempts: $*"
                return 1
              fi
              echo "Attempt $n/$max failed, retrying in ${delay}s..."
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }
          retry docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-backend:$GITHUB_SHA \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-backend:latest \
            -f backend/Dockerfile ./backend
          retry docker push $REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-backend:$GITHUB_SHA
          retry docker push $REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-backend:latest

      - name: Build Frontend
        run: |
          retry() {
            local n=1 max=3 delay=15
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::Command failed after $n attempts: $*"
                return 1
              fi
              echo "Attempt $n/$max failed, retrying in ${delay}s..."
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }
          retry docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-frontend:$GITHUB_SHA \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-frontend:latest \
            -f frontend/Dockerfile ./frontend
          retry docker push $REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-frontend:$GITHUB_SHA
          retry docker push $REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-frontend:latest

      - name: Deploy Backend Jobs
        run: |
          COMMON_ENV="PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,BIGQUERY_DATASET=$BIGQUERY_DATASET"

          gcloud run jobs deploy ads-data-sync \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-backend:$GITHUB_SHA \
            --region=$REGION \
            --set-env-vars="$COMMON_ENV,JOB_TYPE=ads_sync" \
            --memory=2Gi \
            --cpu=2 \
            --max-retries=2 \
            --task-timeout=1h

          # DRY_RUN=False (confirmed 2026-07-15): bid-optimizer's AOV-tier
          # recommendations now auto-apply via apply_bid_changes(). Safety
          # rails live in calculate_optimal_bid() - 7% of AOV ceiling, +-20/25%
          # per-run movement caps, zero-conversion pause gates, 5% noise floor.
          gcloud run jobs deploy bid-optimizer \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-backend:$GITHUB_SHA \
            --region=$REGION \
            --set-env-vars="$COMMON_ENV,JOB_TYPE=bid_optimizer,DRY_RUN=False" \
            --memory=2Gi \
            --cpu=2 \
            --max-retries=1 \
            --task-timeout=1h

      - name: Deploy Frontend
        run: |
          gcloud run deploy amazon-ppc-dashboard \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/amazon-ppc/amazon-ppc-frontend:$GITHUB_SHA \
            --region=$REGION \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10