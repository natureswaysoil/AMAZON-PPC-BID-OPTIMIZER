steps:
  # Build backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/amazon-ppc-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/amazon-ppc-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'
  
  # Push backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/amazon-ppc-backend'
    waitFor: ['build-backend']
  
  # Build frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/amazon-ppc-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/amazon-ppc-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - './frontend'
  
  # Push frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/amazon-ppc-frontend'
    waitFor: ['build-frontend']
  
  # Deploy jobs
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-ads-sync'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run jobs deploy ads-data-sync \
          --image=gcr.io/$PROJECT_ID/amazon-ppc-backend:$SHORT_SHA \
          --region=us-central1 \
          --set-env-vars=JOB_TYPE=ads_sync,GOOGLE_CLOUD_PROJECT=$PROJECT_ID \
          --max-retries=2 \
          --task-timeout=30m \
          --memory=2Gi \
          --cpu=2
    waitFor: ['push-backend']
  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run deploy amazon-ppc-dashboard \
          --image=gcr.io/$PROJECT_ID/amazon-ppc-frontend:$SHORT_SHA \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10
    waitFor: ['push-frontend']

timeout: 1800s

images:
  - 'gcr.io/$PROJECT_ID/amazon-ppc-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/amazon-ppc-backend:latest'
  - 'gcr.io/$PROJECT_ID/amazon-ppc-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/amazon-ppc-frontend:latest'
