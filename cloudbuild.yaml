steps:
  # Build backend
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/amazon-ppc-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'
  
  # Push backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/amazon-ppc-backend:latest']
  
  # Build frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/amazon-ppc-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - './frontend'
  
  # Push frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/amazon-ppc-frontend:latest']
  
  # Deploy backend job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run jobs deploy ads-data-sync \
          --image=gcr.io/$PROJECT_ID/amazon-ppc-backend:latest \
          --region=us-central1 \
          --set-env-vars=JOB_TYPE=ads_sync,GOOGLE_CLOUD_PROJECT=$PROJECT_ID \
          --memory=2Gi \
          --cpu=2 \
          --max-retries=2 \
          --task-timeout=30m
  
  # Deploy frontend service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run deploy amazon-ppc-dashboard \
          --image=gcr.io/$PROJECT_ID/amazon-ppc-frontend:latest \
          --region=us-central1 \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10

timeout: 1800s

images:
  - 'gcr.io/$PROJECT_ID/amazon-ppc-backend:latest'
  - 'gcr.io/$PROJECT_ID/amazon-ppc-frontend:latest'
