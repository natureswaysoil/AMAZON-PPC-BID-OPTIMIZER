steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: Build
    args:
      - 'build'
      - '-f'
      - 'backend/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/amazon-ppc-backend:latest'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: Push
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/amazon-ppc-backend:latest'

images:
  - 'gcr.io/$PROJECT_ID/amazon-ppc-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
